packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Collapse packages that would otherwise be installed more than once because their
# optional peers resolve differently per consumer.
#
dedupePeerDependents: true

allowBuilds:
  bcrypt: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - pnpm
  - '@iwsio/*'
